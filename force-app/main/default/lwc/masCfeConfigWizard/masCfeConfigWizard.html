<template>
    <lightning-card title="Mass Action Configuration" icon-name="standard:settings">
        <div slot="actions">
            <lightning-button
                label="Run Now"
                variant="brand"
                icon-name="utility:play"
                onclick={handleRunNow}
                disabled={isLoading}
            ></lightning-button>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <div class="slds-p-horizontal_medium">
            <!-- ========================= Basics ========================= -->
            <div class="slds-section slds-is-open">
                <h3 class="slds-section__title slds-p-vertical_x-small">
                    <span class="slds-truncate slds-p-horizontal_small">Configuration Basics</span>
                </h3>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            label="Name"
                            class="validated-field"
                            required
                            data-field="Name"
                            value={config.Name}
                            onchange={handleFieldChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            label="Developer Name"
                            data-field="Developer_Name__c"
                            value={config.Developer_Name__c}
                            onchange={handleFieldChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-textarea
                            label="Description"
                            data-field="Description__c"
                            value={config.Description__c}
                            onchange={handleFieldChange}
                        ></lightning-textarea>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input
                            type="number"
                            label="Batch Size"
                            class="validated-field"
                            required
                            min="1"
                            max="200"
                            data-field="Batch_Size__c"
                            value={config.Batch_Size__c}
                            field-level-help="Keep around 50 for Flow targets."
                            onchange={handleFieldChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-top_large">
                        <lightning-input
                            type="toggle"
                            label="Active"
                            checked={config.Active__c}
                            message-toggle-active="Active"
                            message-toggle-inactive="Inactive"
                            onchange={handleActiveToggle}
                        ></lightning-input>
                    </div>
                </div>
            </div>

            <!-- ========================= Source ========================= -->
            <div class="slds-section slds-is-open slds-m-top_medium">
                <h3 class="slds-section__title slds-p-vertical_x-small">
                    <span class="slds-truncate slds-p-horizontal_small">Source Query</span>
                </h3>
                <lightning-textarea
                    label="Source SOQL Query"
                    class="monospace"
                    data-field="Source_SOQL_Query__c"
                    value={config.Source_SOQL_Query__c}
                    onchange={handleFieldChange}
                ></lightning-textarea>
                <div class="slds-m-top_x-small">
                    <lightning-button
                        label="Preview"
                        icon-name="utility:preview"
                        onclick={handlePreview}
                        disabled={isPreviewLoading}
                    ></lightning-button>
                </div>

                <template if:true={isPreviewLoading}>
                    <lightning-spinner alternative-text="Previewing" size="small"></lightning-spinner>
                </template>

                <template if:true={hasPreview}>
                    <div class="slds-m-top_small preview-scroll">
                        <lightning-datatable
                            key-field="_key"
                            columns={previewColumns}
                            data={previewRows}
                            hide-checkbox-column
                            column-widths-mode="auto"
                        ></lightning-datatable>
                    </div>
                </template>
            </div>

            <!-- ========================= Target ========================= -->
            <div class="slds-section slds-is-open slds-m-top_medium">
                <h3 class="slds-section__title slds-p-vertical_x-small">
                    <span class="slds-truncate slds-p-horizontal_small">Target Action</span>
                </h3>
                <lightning-radio-group
                    label="Target Type"
                    type="button"
                    options={targetTypeOptions}
                    value={config.Target_Type__c}
                    onchange={handleTargetTypeChange}
                ></lightning-radio-group>

                <template if:true={isFlowTarget}>
                    <lightning-combobox
                        class="slds-m-top_x-small"
                        label="Flow"
                        placeholder="Select an active flow"
                        options={flowOptions}
                        value={config.Target_Action_Name__c}
                        onchange={handleFlowSelect}
                    ></lightning-combobox>
                </template>

                <template if:true={isApexTarget}>
                    <lightning-combobox
                        class="slds-m-top_x-small"
                        label="Apex Class"
                        placeholder="Select an Apex action"
                        options={apexActionOptions}
                        value={config.Target_Action_Name__c}
                        onchange={handleApexActionSelect}
                    ></lightning-combobox>
                </template>

                <div class="slds-m-top_x-small">
                    <lightning-button
                        label="Load Inputs"
                        icon-name="utility:sync"
                        onclick={handleLoadInputs}
                        disabled={isInputsLoading}
                    ></lightning-button>
                </div>
                <template if:true={isInputsLoading}>
                    <lightning-spinner alternative-text="Loading inputs" size="small"></lightning-spinner>
                </template>
            </div>

            <!-- ====================== Field Mappings ==================== -->
            <div class="slds-section slds-is-open slds-m-top_medium">
                <h3 class="slds-section__title slds-p-vertical_x-small">
                    <span class="slds-truncate slds-p-horizontal_small">Field Mappings</span>
                </h3>

                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Value Type</div></th>
                            <th scope="col"><div class="slds-truncate">Source Field / Value</div></th>
                            <th scope="col"><div class="slds-truncate">Target Parameter</div></th>
                            <th scope="col" class="action-col"><div class="slds-truncate"><span class="slds-assistive-text">Actions</span></div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={mappings} for:item="row">
                            <tr key={row.key}>
                                <td>
                                    <lightning-combobox
                                        label="Value Type"
                                        variant="label-hidden"
                                        options={valueTypeOptions}
                                        data-key={row.key}
                                        value={row.valueType}
                                        onchange={handleValueTypeChange}
                                    ></lightning-combobox>
                                </td>
                                <td>
                                    <template if:true={row.Is_Literal__c}>
                                        <lightning-input
                                            label="Literal Value"
                                            variant="label-hidden"
                                            type="text"
                                            placeholder="Enter a literal value"
                                            data-key={row.key}
                                            data-field="Source_Field_Name__c"
                                            value={row.Source_Field_Name__c}
                                            onchange={handleMappingChange}
                                        ></lightning-input>
                                    </template>
                                    <template if:false={row.Is_Literal__c}>
                                        <lightning-combobox
                                            label="Source Field"
                                            variant="label-hidden"
                                            placeholder="Select a field from the query"
                                            options={sourceFieldOptions}
                                            data-key={row.key}
                                            data-field="Source_Field_Name__c"
                                            value={row.Source_Field_Name__c}
                                            onchange={handleMappingChange}
                                        ></lightning-combobox>
                                    </template>
                                </td>
                                <td>
                                    <lightning-combobox
                                        label="Target Parameter"
                                        variant="label-hidden"
                                        placeholder="Select parameter"
                                        options={targetParamOptions}
                                        data-key={row.key}
                                        data-field="Target_Parameter_Name__c"
                                        value={row.Target_Parameter_Name__c}
                                        onchange={handleMappingChange}
                                    ></lightning-combobox>
                                </td>
                                <td class="slds-text-align_center">
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        variant="border-filled"
                                        alternative-text={row.deleteLabel}
                                        data-key={row.key}
                                        onclick={handleDeleteMapping}
                                    ></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="slds-m-top_x-small">
                    <lightning-button
                        label="Add Row"
                        icon-name="utility:add"
                        onclick={handleAddMapping}
                    ></lightning-button>
                </div>
            </div>

            <!-- ========================= Schedule ======================= -->
            <div class="slds-section slds-is-open slds-m-top_medium">
                <h3 class="slds-section__title slds-p-vertical_x-small">
                    <span class="slds-truncate slds-p-horizontal_small">Schedule</span>
                </h3>
                <lightning-radio-group
                    label="Schedule Type"
                    type="button"
                    options={scheduleTypeOptions}
                    value={config.Schedule_Type__c}
                    onchange={handleScheduleTypeChange}
                ></lightning-radio-group>

                <template if:true={isScheduled}>
                    <div class="slds-m-top_x-small">
                        <lightning-combobox
                            label="Frequency"
                            options={scheduleFrequencyOptions}
                            value={scheduleBuilder.frequency}
                            onchange={handleFrequencyChange}
                        ></lightning-combobox>
                    </div>

                    <template if:true={showSchedulePicker}>
                        <div class="slds-m-top_x-small">
                            <lightning-input
                                type="time"
                                label="Time"
                                value={scheduleTimeValue}
                                onchange={handleScheduleTimeChange}
                            ></lightning-input>
                        </div>
                    </template>

                    <template if:true={isWeeklyFrequency}>
                        <div class="slds-m-top_x-small">
                            <lightning-checkbox-group
                                label="Days of Week"
                                options={dayOfWeekOptions}
                                value={scheduleBuilder.daysOfWeek}
                                onchange={handleDaysOfWeekChange}
                            ></lightning-checkbox-group>
                        </div>
                    </template>

                    <template if:true={isMonthlyFrequency}>
                        <div class="slds-m-top_x-small">
                            <lightning-combobox
                                label="Day of Month"
                                options={dayOfMonthOptions}
                                value={scheduleBuilder.dayOfMonth}
                                onchange={handleDayOfMonthChange}
                            ></lightning-combobox>
                        </div>
                    </template>

                    <template if:true={isCustomFrequency}>
                        <div class="slds-m-top_x-small">
                            <lightning-input
                                label="Cron Expression"
                                data-field="Schedule_Cron__c"
                                value={config.Schedule_Cron__c}
                                onchange={handleFieldChange}
                            ></lightning-input>
                        </div>
                        <div class="slds-m-top_x-small">
                            <template for:each={cronPresets} for:item="preset">
                                <lightning-button
                                    key={preset.label}
                                    class="slds-m-right_x-small"
                                    label={preset.label}
                                    data-cron={preset.cron}
                                    onclick={handleCronPreset}
                                ></lightning-button>
                            </template>
                        </div>
                    </template>

                    <p class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
                        Effective cron expression:&nbsp;<code>{config.Schedule_Cron__c}</code>&nbsp;- click&nbsp;<strong>Save</strong>&nbsp;below to apply it.
                    </p>
                    <template if:true={hasScheduledJob}>
                        <p class="slds-m-top_x-small slds-text-body_small">
                            Current scheduled job:&nbsp;<strong>{config.Scheduled_Job_Id__c}</strong>
                        </p>
                    </template>
                </template>
            </div>

            <!-- ==================== Last run summary ==================== -->
            <template if:true={hasLastRun}>
                <p class="slds-m-top_medium slds-text-body_small">
                    Last run:&nbsp;<strong>{config.Last_Run_Status__c}</strong>&nbsp;<span if:true={config.Last_Run_Completed_Date__c}>on&nbsp;<lightning-formatted-date-time
                        value={config.Last_Run_Completed_Date__c}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time></span>
                </p>
            </template>
        </div>

        <!-- ========================= Footer ========================= -->
        <div slot="footer" class="slds-grid slds-grid_align-end">
            <lightning-button
                class="slds-m-right_x-small"
                label="Save"
                variant="brand"
                icon-name="utility:save"
                onclick={handleSave}
                disabled={isLoading}
            ></lightning-button>
            <lightning-button
                label="Run Now"
                variant="success"
                icon-name="utility:play"
                onclick={handleRunNow}
                disabled={isLoading}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
